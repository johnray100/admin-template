<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html lang="en"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

<h:head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Admin Template — Logout</title>

    <style>
        * { box-sizing: border-box; }
        html, body {
            margin: 0; padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
            "Helvetica Neue", Arial, sans-serif;
            font-size: 12px;
            background: linear-gradient(135deg, #343a40 0%, #1f2937 100%);
            color: #333;
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
        }

        .logout-card {
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            padding: 40px 44px;
            max-width: 420px;
            width: 90%;
            text-align: center;
        }

        .logout-icon {
            width: 72px; height: 72px;
            border-radius: 50%;
            background: linear-gradient(135deg, #dc3545, #a71d2a);
            color: #fff;
            display: flex; align-items: center; justify-content: center;
            font-size: 32px;
            margin: 0 auto 20px;
            box-shadow: 0 8px 20px rgba(220,53,69,0.35);
        }

        .logout-title {
            font-size: 20px;
            font-weight: 700;
            color: #1f2937;
            margin: 0 0 8px;
        }

        .logout-message {
            font-size: 13px;
            color: #6b7280;
            margin: 0 0 28px;
            line-height: 1.5;
        }

        .user-preview {
            background: #f8fafc;
            border-radius: 6px;
            padding: 12px 16px;
            display: flex; align-items: center;
            gap: 12px;
            margin-bottom: 24px;
            text-align: left;
        }
        .user-avatar {
            width: 40px; height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #2563eb, #1e3a8a);
            color: #fff;
            display: flex; align-items: center; justify-content: center;
            font-weight: 700;
            font-size: 13px;
            flex-shrink: 0;
        }
        .user-name {
            font-weight: 700;
            font-size: 13px;
            color: #1f2937;
        }
        .user-email {
            font-size: 11px;
            color: #6b7280;
            margin-top: 1px;
        }

        .logout-actions {
            display: flex; gap: 10px;
        }

        .btn {
            flex: 1;
            display: inline-flex; align-items: center; justify-content: center;
            gap: 6px;
            padding: 11px 16px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            border: 1px solid transparent;
            cursor: pointer;
            transition: all .15s;
            text-decoration: none;
            font-family: inherit;
        }
        .btn i { font-size: 13px; }
        .btn-danger {
            background: linear-gradient(135deg, #dc3545, #a71d2a);
            color: #fff;
        }
        .btn-danger:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 14px rgba(220,53,69,0.35);
        }
        .btn-secondary {
            background: #fff;
            color: #374151;
            border-color: #d1d5db;
        }
        .btn-secondary:hover { background: #f3f4f6; }

        .logout-footer {
            margin-top: 24px;
            font-size: 11px;
            color: #9ca3af;
        }
    </style>
</h:head>

<h:body>
    <f:view>
        <div class="logout-card">

            <div class="logout-icon">
                <i class="pi pi-sign-out"></i>
            </div>

            <h2 class="logout-title">Sign Out?</h2>
            <p class="logout-message">
                You are about to end your session. <br/>
                Any unsaved changes will be lost.
            </p>

            <div class="user-preview">
                <div class="user-avatar">AD</div>
                <div>
                    <div class="user-name">Administrator</div>
                    <div class="user-email">admin@sandbox.com.ph</div>
                </div>
            </div>

            <div class="logout-actions">
                <a href="#{request.contextPath}/pages/dashboard/dashboard.xhtml"
                   class="btn btn-secondary">
                    <i class="pi pi-times"></i> Cancel
                </a>
                <a href="#{request.contextPath}/index.xhtml"
                   class="btn btn-danger">
                    <i class="pi pi-sign-out"></i> Yes, Logout
                </a>
            </div>

            <div class="logout-footer">
                © 2026 Admin Template · Version 1.0.0
            </div>

        </div>
    </f:view>
</h:body>
</html>
